<div class="login-page">
  <div class="login-card">

    <div class="brand">LANG</div>

    <h1>WhatsApp se login</h1>
    <p class="subtitle">Number likho. Code WhatsApp pe aayega. Password nahi.</p>

    @if (step() === 'phone') {
      <div class="form-group">
        <label>WhatsApp number</label>
        <input
          type="tel"
          inputmode="tel"
          autocomplete="tel"
          placeholder="+92 300 1234567"
          [value]="phone()"
          (input)="onPhoneInput($event)"
        />
      </div>

      @if (error()) {
        <div class="error">{{ error() }}</div>
      }

      <button class="login-btn" type="button" (click)="sendOtp()" [disabled]="loading()">
        {{ loading() ? 'Bhej rahe...' : 'Code bhejo' }}
      </button>
    } @else {
      <p class="subtitle">{{ info() }} · {{ phone() }}</p>

      <div class="form-group">
        <label>6-digit code</label>
        <input
          type="text"
          inputmode="numeric"
          maxlength="6"
          autocomplete="one-time-code"
          placeholder="------"
          [value]="code()"
          (input)="onCodeInput($event)"
        />
      </div>

      @if (error()) {
        <div class="error">{{ error() }}</div>
      }

      <button class="login-btn" type="button" (click)="verify()" [disabled]="loading()">
        {{ loading() ? 'Check...' : 'Verify' }}
      </button>

      <button
        class="ghost-btn"
        type="button"
        [disabled]="resendIn() > 0 || loading()"
        (click)="sendOtp()"
      >
        {{ resendIn() > 0 ? 'Dobara ' + resendIn() + 's' : 'Code dobara bhejo' }}
      </button>

      <button class="ghost-btn" type="button" (click)="backToPhone()">
        Number change
      </button>
    }

  </div>
</div>
